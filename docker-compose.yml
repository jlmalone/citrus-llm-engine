version: '3.8'

services:
  citrus-llm-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citrus-llm-engine
    ports:
      - "8000:8000"
    environment:
      # Application Settings
      - APP_NAME=Citrus LLM Engine
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO

      # LLM Provider (lmstudio, ollama, openai)
      - LLM_PROVIDER=lmstudio

      # LM Studio Settings (use host.docker.internal for Mac/Windows, 172.17.0.1 for Linux)
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL=local-model

      # Ollama Settings
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3

      # OpenAI Settings (uncomment if using OpenAI)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_BASE_URL=https://api.openai.com/v1

      # Request Settings
      - DEFAULT_TEMPERATURE=0.1
      - DEFAULT_MAX_TOKENS=2000
      - REQUEST_TIMEOUT=120

    # Use host network on Linux for easier LM Studio/Ollama access
    # network_mode: host  # Uncomment for Linux

    # For Mac/Windows, add extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Optional: Mount a volume for logs
    # volumes:
    #   - ./logs:/app/logs

# Optional: Add a network
networks:
  default:
    name: citrus-network
